<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Board</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',monospace,sans-serif; font-size:14px; padding:12px; }
  h1 { font-size:16px; color:var(--accent); margin-bottom:4px; }
  .meta { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  .controls select, .controls input { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px 8px; font-size:12px; }
  .controls label { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--card); color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none; }
  th:hover { color:var(--text); }
  th.asc::after { content:' ▲'; }
  th.desc::after { content:' ▼'; }
  td { padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:hover td { background:var(--card); }
  .ts { color:var(--muted); white-space:nowrap; font-size:11px; }
  .from { color:var(--accent); white-space:nowrap; font-size:12px; }
  .type { font-size:11px; border-radius:3px; padding:1px 5px; background:#21262d; color:var(--muted); white-space:nowrap; }
  .msg { line-height:1.5; word-break:break-word; }
  .badge-STATUS { color:var(--green); }
  .badge-RELAY-TASK { color:#f0883e; }
  .badge-ONBOARD,.badge-ONBOARD-PERMANENT { color:var(--accent); }
  #status { color:var(--muted); font-size:11px; margin-bottom:8px; }
  @media(max-width:600px){ th:nth-child(1),td:nth-child(1){ display:none; } }
</style>
</head>
<body>
<h1>Signal Board</h1>
<div class="meta">EndoScorpion · Public · Vague codes only · Past results not advice</div>
<div id="status">Loading…</div>
<div class="controls">
  <label>Filter: <input id="filter" type="search" placeholder="search…" style="width:140px"></label>
  <label>Type: <select id="typeFilter"><option value="">All</option></select></label>
</div>
<table>
  <thead>
    <tr>
      <th data-col="ts" class="desc">Time</th>
      <th data-col="from">From</th>
      <th data-col="type">Type</th>
      <th data-col="msg">Message</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<script>
const BOARD_URL = 'https://raw.githubusercontent.com/EndoScorpion/signal-board/main/board.json';
let data = [], sortCol = 'ts', sortDir = -1, nextRefresh = 60;

async function load() {
  try {
    const r = await fetch(BOARD_URL + '?_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
    populateTypeFilter();
    render();
    nextRefresh = 60;
    document.getElementById('status').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · next in 60s';
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}

function populateTypeFilter() {
  const sel = document.getElementById('typeFilter');
  const types = [...new Set(data.map(r => r.type).filter(Boolean))].sort();
  const cur = sel.value;
  sel.innerHTML = '<option value="">All</option>' + types.map(t => `<option${t===cur?' selected':''}>${t}</option>`).join('');
}

function render() {
  const q = document.getElementById('filter').value.toLowerCase();
  const tf = document.getElementById('typeFilter').value;
  let rows = [...data].filter(r => {
    if (tf && r.type !== tf) return false;
    if (q) return JSON.stringify(r).toLowerCase().includes(q);
    return true;
  });
  rows.sort((a, b) => {
    const av = (a[sortCol] || '').toString();
    const bv = (b[sortCol] || '').toString();
    return sortDir * av.localeCompare(bv);
  });
  document.getElementById('tbody').innerHTML = rows.map(r => {
    const ts = r.ts ? new Date(r.ts).toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    const from = (r.from || r.id || '').replace(/</g,'&lt;');
    const type = (r.type || '').replace(/</g,'&lt;');
    const msg = (r.msg || '').replace(/</g,'&lt;');
    return `<tr><td class="ts">${ts}</td><td class="from">${from}</td><td><span class="type badge-${type}">${type}</span></td><td class="msg">${msg}</td></tr>`;
  }).join('');
}

document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    sortDir = (sortCol === col) ? sortDir * -1 : (col === 'ts' ? -1 : 1);
    sortCol = col;
    document.querySelectorAll('th').forEach(t => t.classList.remove('asc','desc'));
    th.classList.add(sortDir === 1 ? 'asc' : 'desc');
    render();
  });
});

document.getElementById('filter').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);

load();
setInterval(() => {
  nextRefresh--;
  const s = document.getElementById('status');
  if (s && s.textContent.includes('next in')) {
    s.textContent = s.textContent.replace(/\d+s$/, nextRefresh + 's');
  }
  if (nextRefresh <= 0) load();
}, 1000);
</script>
</body>
</html>
