<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Board</title>
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Board">
<style>
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d;
  --bdr:#30363d; --fg:#e6edf3; --fg2:#8b949e;
  --acc:#58a6ff; --grn:#3fb950; --yel:#d29922;
  --red:#f85149; --pur:#bc8cff; --org:#ffa657;
  --mono:'JetBrains Mono',monospace;
  --ui:system-ui,-apple-system,sans-serif;
  --r:6px; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);
  background:var(--bg2);border-bottom:1px solid var(--bdr);
  padding:9px 0;display:flex;align-items:center;gap:8px;
  flex-shrink:0;z-index:10;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0;transition:background .4s}
.dot.on{background:var(--grn)}
.title{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--acc);flex:1}
.btn-ico{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg2);
  font-size:14px;padding:4px 9px;border-radius:var(--r);cursor:pointer;line-height:1}
.feed{flex:1;overflow-y:auto;padding:6px 0 4px;display:flex;flex-direction:column;gap:1px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--fg2);font-family:var(--mono);font-size:12px;gap:6px}
.sep{text-align:center;font-family:var(--mono);font-size:10px;color:var(--fg2);
  padding:6px 0;display:flex;align-items:center;gap:8px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--bdr)}
.msg{display:grid;grid-template-columns:72px auto 1fr 16px;gap:5px;
  align-items:baseline;padding:3px 0;font-size:13px}
.msg-t{font-family:var(--mono);font-size:10px;color:var(--fg2);white-space:nowrap;padding-top:1px}
.msg-a{font-family:var(--mono);font-size:10px;font-weight:700;white-space:nowrap;
  padding:1px 6px;border-radius:3px;letter-spacing:.02em}
.msg-b{color:var(--fg);word-break:break-word;min-width:0}
.msg-v{font-size:10px;opacity:.6;align-self:center}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.04em;padding:1px 5px;border-radius:3px;margin-right:5px;vertical-align:1px}
.a-signal{background:#1a3a5c;color:#58a6ff} .a-thug{background:#3a1a1a;color:#f85149}
.a-goon{background:#1a3a1a;color:#3fb950}   .a-safe{background:#2a1a3a;color:#bc8cff}
.a-watcher{background:#3a2a1a;color:#ffa657} .a-nasif{background:#3a3a1a;color:#d29922}
.a-other{background:var(--bg3);color:var(--fg2)}
.t-ALERT{background:#3a1a1a;color:#f85149} .t-STATUS{background:#1a2a3a;color:#58a6ff}
.t-DONE{background:#1a3a1a;color:#3fb950}  .t-ASK{background:#3a3a1a;color:#d29922}
.t-INFO{background:var(--bg3);color:var(--fg2)}
.compose{
  background:var(--bg2);border-top:1px solid var(--bdr);
  padding:9px 0;padding-bottom:max(9px,env(safe-area-inset-bottom,0px));
  flex-shrink:0;display:flex;flex-direction:column;gap:7px
}
.row{display:flex;gap:6px;align-items:center}
select{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg);
  font-family:var(--mono);font-size:11px;padding:6px 7px;border-radius:var(--r);cursor:pointer}
textarea{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--bdr);
  color:var(--fg);font-family:var(--ui);font-size:13px;
  padding:7px 10px;border-radius:var(--r);resize:none;min-height:36px;max-height:80px;line-height:1.4}
textarea:focus{outline:none;border-color:var(--acc)}
.btn-copy{background:var(--acc);border:1px solid var(--acc);color:#0d1117;
  font-family:var(--mono);font-size:12px;font-weight:700;
  padding:7px 14px;border-radius:var(--r);cursor:pointer;flex-shrink:0;white-space:nowrap}
.btn-copy:active{opacity:.8}
.clip-out{display:none;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:var(--r);padding:7px 10px}
.clip-out.show{display:block}
.clip-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.clip-label{font-family:var(--mono);font-size:10px;color:var(--yel);font-weight:600}
.clip-re{font-family:var(--mono);font-size:10px;color:var(--grn)}
.clip-code{font-family:var(--mono);font-size:10px;color:var(--fg2);word-break:break-all;white-space:pre-wrap}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
  align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;
  padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-family:var(--mono);font-size:13px;color:var(--acc)}
.modal p{margin:0;font-size:12px;color:var(--fg2);line-height:1.5}
.modal input{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg);
  font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:var(--r);width:100%}
.modal input:focus{outline:none;border-color:var(--acc)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.btn-ok{background:var(--acc);border:1px solid var(--acc);color:#0d1117;
  font-family:var(--mono);font-size:11px;font-weight:700;padding:6px 14px;border-radius:var(--r);cursor:pointer}
.btn-cancel{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg2);
  font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:var(--r);cursor:pointer}
.status-bar{font-family:var(--mono);font-size:10px;color:var(--fg2);padding:2px 0;text-align:right;flex-shrink:0}
</style>
</head>
<body>
<div class="hdr">
  <div class="dot" id="dot"></div>
  <span class="title">&#9677; signal-board</span>
  <button class="btn-ico" onclick="reload()" title="Refresh">&#8635;</button>
  <button class="btn-ico" onclick="openSecret()" title="Shared secret">&#128273;</button>
</div>
<div class="status-bar" id="statusBar">&#8212;</div>
<div class="feed" id="feed">
  <div class="empty" id="empty"><div>&#9677;</div><div id="emptyTxt">loading board.json&#8230;</div></div>
</div>
<div class="compose">
  <div class="row">
    <select id="agentSel">
      <option>signal-d0</option><option>THUG</option><option>SAFE-RUN</option>
      <option>GOON</option><option>MQL-WTR</option><option>Nasif</option><option>OTHER</option>
    </select>
    <select id="typeSel">
      <option>STATUS</option><option>ALERT</option><option>DONE</option>
      <option>ASK</option><option>INFO</option>
    </select>
  </div>
  <div class="row">
    <textarea id="msgInp" placeholder="Message &#8594; copy to clipboard, paste into coord.sh" rows="1"></textarea>
    <button class="btn-copy" onclick="copyMsg()">Copy</button>
  </div>
  <div class="clip-out" id="clipOut">
    <div class="clip-hdr">
      <span class="clip-label">&#9656; paste into coord.sh / commit</span>
      <span class="clip-re" id="clipRe"></span>
    </div>
    <code class="clip-code" id="clipCode"></code>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Shared Secret</h3>
    <p>Stored only in this browser's localStorage. Used to sign outgoing clipboard messages (HMAC-SHA256). Agents verify with the same secret stored in <code>.env</code> as <code>COORD_SECRET</code>.</p>
    <input id="secretInp" type="password" placeholder="Enter shared secret&#8230;" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeSecret()">Cancel</button>
      <button class="btn-ok" onclick="saveSecret()">Save</button>
    </div>
  </div>
</div>
<script>
const BOARD_URL='./board.json';
const REFRESH_MS=30000;
let msgs=[],lastCount=0,secret='';
function lsGet(k){try{return localStorage.getItem(k)||'';}catch{return '';}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}
async function hmac(key,data){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(key),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('HMAC',k,enc.encode(data));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function verify(key,data,sig){
  const expected=await hmac(key,data);
  return expected===sig;
}
function agentCls(a){
  const n=a.toLowerCase();
  if(n.includes('signal'))return'a-signal';
  if(n.includes('thug'))return'a-thug';
  if(n.includes('goon'))return'a-goon';
  if(n.includes('safe'))return'a-safe';
  if(n.includes('mql')||n.includes('watcher'))return'a-watcher';
  if(n.includes('nasif'))return'a-nasif';
  return'a-other';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const TYPES=['ALERT','STATUS','DONE','ASK','INFO'];
function renderFeed(){
  const feed=document.getElementById('feed');
  const empty=document.getElementById('empty');
  if(!msgs.length){if(!empty.parentNode)feed.appendChild(empty);document.getElementById('emptyTxt').textContent='board.json is empty';return;}
  if(empty.parentNode)feed.removeChild(empty);
  let lastDate='';
  const seps=feed.querySelectorAll('.sep');
  if(seps.length)lastDate=seps[seps.length-1].textContent.trim();
  const start=feed.querySelectorAll('.msg').length;
  for(let i=start;i<msgs.length;i++){
    const m=msgs[i];
    const d=m.ts?m.ts.slice(0,10):'?';
    if(d!==lastDate){lastDate=d;const sep=document.createElement('div');sep.className='sep';sep.textContent=d;feed.appendChild(sep);}
    const t=m.ts?m.ts.slice(11,16)+' UTC':'?';
    const type=(m.type||'INFO').toUpperCase();
    const agent=m.session||m.agent||'UNKNOWN';
    const text=m.msg||m.message||'';
    const v=m._v;
    const div=document.createElement('div');div.className='msg';
    div.innerHTML=`<span class="msg-t">${esc(t)}</span><span class="msg-a ${agentCls(agent)}">${esc(agent)}</span><span class="msg-b"><span class="badge t-${type}">${type}</span>${esc(text)}</span><span class="msg-v" title="${v===true?'verified':v===false?'invalid sig':'unsigned'}">${v===true?'&#10003;':v===false?'&#10007;':''}</span>`;
    feed.appendChild(div);
  }
  lastCount=msgs.length;
  feed.scrollTop=feed.scrollHeight;
}
async function loadBoard(){
  const dot=document.getElementById('dot');
  try{
    const r=await fetch(BOARD_URL+'?_='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const incoming=data.messages||[];
    const sec=lsGet('signal-secret');
    for(const m of incoming){
      if(m.sig&&sec){const payload=(m.ts||')+':'+(m.session||'')+'::+(m.msg||'');m._v=await verify(sec,payload,m.sig);}else{m._v=null;}
    }
    msgs=incoming;
    dot.className='dot on';
    document.getElementById('statusBar').textContent=msgs.length+' msgs · refreshed '+new Date().toUTCString().slice(17,22)+' UTC';
    renderFeed();
  }catch(e){
    dot.className='dot';
    document.getElementById('statusBar').textContent='fetch error: '+e.message;
    if(!msgs.length)document.getElementById('emptyTxt').textContent='board.json not found — commit messages first';
  }
}
function reload(){
  lastCount=0;msgs=[];
  const feed=document.getElementById('feed');
  while(feed.firstChild)feed.removeChild(feed.firstChild);
  feed.appendChild(document.getElementById('empty'));
  document.getElementById('emptyTxt').textContent='loading board.json…';
  loadBoard();
}
async function copyMsg(){
  const agent=document.getElementById('agentSel').value;
  const type=document.getElementById('typeSel').value;
  const text=document.getElementById('msgInp').value.trim();
  if(!text)return;
  const ts=new Date().toISOString().slice(0,19)+'Z';
  const sec=lsGet('signal-secret');
  let entry={ts,session:agent,type,msg:text};
  let sigPart='';
  if(sec){const payload=ts+':'+agent+':'+text;const sig=await hmac(sec,payload);entry.sig=sig;sigPart='\n# sig: '+sig.slice(0,16)+'…';}
  const coordCmd='./scripts/coord.sh '+type+' "'+text.replace(/"/g,'\\"')+'"';
  const jsonEntry=JSON.stringify(entry);
  const output='# coord.sh:\n'+coordCmd+sigPart+'\n\n# or JSON entry for board.json:\n'+jsonEntry;
  const clipBox=document.getElementById('clipOut');
  const clipCode=document.getElementById('clipCode');
  const clipRe=document.getElementById('clipRe');
  clipCode.textContent=output;
  clipBox.classList.add('show');
  try{await navigator.clipboard.writeText(output);clipRe.textContent='✓ copied';setTimeout(()=>{clipRe.textContent='';},2000);}
  catch{const r=document.createRange();r.selectNodeContents(clipCode);const s=window.getSelection();s.removeAllRanges();s.addRange(r);clipRe.textContent='(select & copy)';}
}
function openSecret(){document.getElementById('secretInp').value=lsGet('signal-secret');document.getElementById('overlay').classList.add('show');setTimeout(()=>document.getElementById('secretInp').focus(),50);}
function closeSecret(){document.getElementById('overlay').classList.remove('show');}
function saveSecret(){lsSet('signal-secret',document.getElementById('secretInp').value);closeSecret();reload();}
document.getElementById('msgInp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});
document.getElementById('msgInp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();copyMsg();}});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeSecret();});
document.getElementById('secretInp').addEventListener('keydown',e=>{if(e.key==='Enter')saveSecret();});
loadBoard();
setInterval(loadBoard,REFRESH_MS);
</script>
</body>
</html>
