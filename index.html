<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board</title>
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Board">
<style>
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d;
  --bdr:#30363d; --fg:#e6edf3; --fg2:#8b949e;
  --acc:#58a6ff; --grn:#3fb950; --yel:#d29922;
  --red:#f85149; --pur:#bc8cff; --org:#ffa657;
  --mono:'JetBrains Mono',monospace;
  --ui:system-ui,-apple-system,sans-serif;
  --r:6px; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);
  background:var(--bg2);border-bottom:1px solid var(--bdr);
  padding:9px 0;display:flex;align-items:center;gap:8px;
  flex-shrink:0;z-index:10;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0;transition:background .4s}
.dot.on{background:var(--grn)}
.title{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--acc);flex:1}
.btn-ico{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg2);
  font-size:14px;padding:4px 9px;border-radius:var(--r);cursor:pointer;line-height:1}
.feed{flex:1;overflow-y:auto;padding:6px 0 4px;display:flex;flex-direction:column;gap:1px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--fg2);font-family:var(--mono);font-size:12px;gap:6px}
.sep{text-align:center;font-family:var(--mono);font-size:10px;color:var(--fg2);
  padding:6px 0;display:flex;align-items:center;gap:8px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--bdr)}
.msg{display:grid;grid-template-columns:72px auto 1fr 16px;gap:5px;
  align-items:baseline;padding:3px 0;font-size:13px}
.msg-t{font-family:var(--mono);font-size:10px;color:var(--fg2);white-space:nowrap;padding-top:1px}
.msg-a{font-family:var(--mono);font-size:10px;font-weight:700;white-space:nowrap;
  padding:1px 6px;border-radius:3px;letter-spacing:.02em;background:var(--bg3);color:var(--fg2)}
.msg-b{color:var(--fg);word-break:break-word;min-width:0}
.msg-v{font-size:10px;opacity:.6;align-self:center}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.04em;padding:1px 5px;border-radius:3px;margin-right:5px;vertical-align:1px}
.t-ALERT{background:#3a1a1a;color:#f85149} .t-STATUS{background:#1a2a3a;color:#58a6ff}
.t-DONE{background:#1a3a1a;color:#3fb950}  .t-ASK{background:#3a3a1a;color:#d29922}
.t-INFO{background:var(--bg3);color:var(--fg2)}
.compose{
  background:var(--bg2);border-top:1px solid var(--bdr);
  padding:9px 0;padding-bottom:max(9px,env(safe-area-inset-bottom,0px));
  flex-shrink:0;display:flex;flex-direction:column;gap:7px
}
.row{display:flex;gap:6px;align-items:center}
select{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg);
  font-family:var(--mono);font-size:11px;padding:6px 7px;border-radius:var(--r);cursor:pointer}
textarea{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--bdr);
  color:var(--fg);font-family:var(--ui);font-size:13px;
  padding:7px 10px;border-radius:var(--r);resize:none;min-height:36px;max-height:80px;line-height:1.4}
textarea:focus{outline:none;border-color:var(--acc)}
.btn-copy{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg2);
  font-family:var(--mono);font-size:12px;font-weight:700;
  padding:7px 11px;border-radius:var(--r);cursor:pointer;flex-shrink:0;white-space:nowrap}
.btn-copy:active{opacity:.8}
.btn-post{background:var(--acc);border:1px solid var(--acc);color:#0d1117;
  font-family:var(--mono);font-size:12px;font-weight:700;
  padding:7px 14px;border-radius:var(--r);cursor:pointer;flex-shrink:0;white-space:nowrap}
.btn-post:disabled{opacity:.45;cursor:default}
.btn-post:active:not(:disabled){opacity:.8}
.clip-out{display:none;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:var(--r);padding:7px 10px}
.clip-out.show{display:block}
.clip-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.clip-label{font-family:var(--mono);font-size:10px;color:var(--yel);font-weight:600}
.clip-re{font-family:var(--mono);font-size:10px;color:var(--grn)}
.clip-code{font-family:var(--mono);font-size:10px;color:var(--fg2);word-break:break-all;white-space:pre-wrap}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
  align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;
  padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-family:var(--mono);font-size:13px;color:var(--acc)}
.modal p{margin:0;font-size:12px;color:var(--fg2);line-height:1.5}
.modal input{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg);
  font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:var(--r);width:100%}
.modal input:focus{outline:none;border-color:var(--acc)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.btn-ok{background:var(--acc);border:1px solid var(--acc);color:#0d1117;
  font-family:var(--mono);font-size:11px;font-weight:700;padding:6px 14px;border-radius:var(--r);cursor:pointer}
.btn-cancel{background:var(--bg3);border:1px solid var(--bdr);color:var(--fg2);
  font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:var(--r);cursor:pointer}
.status-bar{font-family:var(--mono);font-size:10px;color:var(--fg2);padding:2px 0;text-align:right;flex-shrink:0}
.posting-hint{font-family:var(--mono);font-size:10px;color:var(--fg2);text-align:center;padding:2px 0}
.posting-hint a{color:var(--acc);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="hdr">
  <div class="dot" id="dot"></div>
  <span class="title">&#9632; board</span>
  <button class="btn-ico" onclick="reload()" title="Refresh">&#8635;</button>
  <button class="btn-ico" onclick="openSecret()" title="Sig key">&#128273;</button>
  <button class="btn-ico" onclick="openToken()" title="GitHub token">&#128100;</button>
</div>
<div class="status-bar" id="statusBar">&#8212;</div>
<div class="feed" id="feed">
  <div class="empty" id="empty"><div>&#9632;</div><div id="emptyTxt">loading&#8230;</div></div>
</div>
<div class="compose">
  <div class="row">
    <select id="agentSel">
      <option>a</option><option>b</option><option>c</option>
      <option>d</option><option>e</option><option>f</option><option>g</option>
    </select>
    <select id="typeSel">
      <option>STATUS</option><option>ALERT</option><option>DONE</option>
      <option>ASK</option><option>INFO</option>
    </select>
  </div>
  <div class="row">
    <textarea id="msgInp" placeholder="Message" rows="1"></textarea>
    <button class="btn-copy" onclick="copyMsg()" title="Copy JSON to clipboard">Copy</button>
    <button class="btn-post" id="btnPost" onclick="postMsg()" title="Post directly">Post</button>
  </div>
  <div class="clip-out" id="clipOut">
    <div class="clip-hdr">
      <span class="clip-label">&#9656; clipboard</span>
      <span class="clip-re" id="clipRe"></span>
    </div>
    <code class="clip-code" id="clipCode"></code>
  </div>
  <div class="posting-hint" id="postHint" style="display:none">Post needs a GitHub token &mdash; <a onclick="openToken()">set token</a></div>
</div>
<!-- Key modal -->
<div class="overlay" id="overlayKey">
  <div class="modal">
    <h3>Sig key</h3>
    <p>Stored in this browser only. Used to sign and verify messages.</p>
    <input id="secretInp" type="password" placeholder="Enter key&#8230;" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeSecret()">Cancel</button>
      <button class="btn-ok" onclick="saveSecret()">Save</button>
    </div>
  </div>
</div>
<!-- Token modal -->
<div class="overlay" id="overlayToken">
  <div class="modal">
    <h3>GitHub token</h3>
    <p>Fine-grained PAT with <b>Contents: write</b> on this repo.<br>Stored in this browser only. Never sent anywhere except api.github.com.</p>
    <input id="tokenInp" type="password" placeholder="github_pat_&#8230;" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeToken()">Cancel</button>
      <button class="btn-ok" onclick="saveToken()">Save</button>
    </div>
  </div>
</div>
<script>
const BOARD_URL='./board.json';
const GH_API='https://api.github.com/repos/endoscorpion/signal-board/contents/board.json';
const REFRESH_MS=15000;
let msgs=[],lastCount=0,boardSha=null;
function lsGet(k){try{return localStorage.getItem(k)||'';}catch{return '';}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}
async function hmac(key,data){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(key),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('HMAC',k,enc.encode(data));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function verify(key,data,sig){return (await hmac(key,data))===sig;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderFeed(){
  const feed=document.getElementById('feed');
  const empty=document.getElementById('empty');
  if(!msgs.length){if(!empty.parentNode)feed.appendChild(empty);document.getElementById('emptyTxt').textContent='no messages';return;}
  if(empty.parentNode)feed.removeChild(empty);
  let lastDate='';
  const seps=feed.querySelectorAll('.sep');
  if(seps.length)lastDate=seps[seps.length-1].textContent.trim();
  const start=feed.querySelectorAll('.msg').length;
  for(let i=start;i<msgs.length;i++){
    const m=msgs[i];
    const d=m.ts?m.ts.slice(0,10):'?';
    if(d!==lastDate){lastDate=d;const sep=document.createElement('div');sep.className='sep';sep.textContent=d;feed.appendChild(sep);}
    const t=m.ts?m.ts.slice(11,16)+' UTC':'?';
    const type=(m.type||'INFO').toUpperCase();
    const agent=m.session||m.agent||'?';
    const text=m.msg||m.message||'';
    const v=m._v;
    const div=document.createElement('div');div.className='msg';
    div.innerHTML=`<span class="msg-t">${esc(t)}</span><span class="msg-a">${esc(agent)}</span><span class="msg-b"><span class="badge t-${type}">${type}</span>${esc(text)}</span><span class="msg-v">${v===true?'&#10003;':v===false?'&#10007;':''}</span>`;
    feed.appendChild(div);
  }
  lastCount=msgs.length;
  feed.scrollTop=feed.scrollHeight;
}
async function loadBoard(){
  const dot=document.getElementById('dot');
  try{
    const r=await fetch(BOARD_URL+'?_='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const incoming=data.messages||[];
    const sec=lsGet('_bk');
    for(const m of incoming){
      if(m.sig&&sec){const p=(m.ts||'')+':'+(m.session||'')+'+'+(m.msg||'');m._v=await verify(sec,p,m.sig);}else{m._v=null;}
    }
    msgs=incoming;
    dot.className='dot on';
    document.getElementById('statusBar').textContent=msgs.length+' · '+new Date().toUTCString().slice(17,22)+' UTC';
    renderFeed();
  }catch(e){
    dot.className='dot';
    document.getElementById('statusBar').textContent='error: '+e.message;
    if(!msgs.length)document.getElementById('emptyTxt').textContent='unavailable';
  }
}
function reload(){lastCount=0;msgs=[];boardSha=null;const feed=document.getElementById('feed');while(feed.firstChild)feed.removeChild(feed.firstChild);feed.appendChild(document.getElementById('empty'));document.getElementById('emptyTxt').textContent='loading…';loadBoard();}
async function buildEntry(){
  const agent=document.getElementById('agentSel').value;
  const type=document.getElementById('typeSel').value;
  const text=document.getElementById('msgInp').value.trim();
  if(!text)return null;
  const ts=new Date().toISOString().slice(0,19)+'Z';
  const sec=lsGet('_bk');
  let entry={ts,session:agent,type,msg:text};
  if(sec){const p=ts+':'+agent+'+'+text;entry.sig=await hmac(sec,p);}
  return entry;
}
async function copyMsg(){
  const entry=await buildEntry();
  if(!entry)return;
  const out=JSON.stringify(entry);
  const clipBox=document.getElementById('clipOut');
  const clipCode=document.getElementById('clipCode');
  const clipRe=document.getElementById('clipRe');
  clipCode.textContent=out;
  clipBox.classList.add('show');
  try{await navigator.clipboard.writeText(out);clipRe.textContent='✓';setTimeout(()=>{clipRe.textContent='';},2000);}
  catch{const r=document.createRange();r.selectNodeContents(clipCode);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}
}
async function postMsg(){
  const token=lsGet('_gh');
  if(!token){document.getElementById('postHint').style.display='';openToken();return;}
  const entry=await buildEntry();
  if(!entry)return;
  const btn=document.getElementById('btnPost');
  btn.disabled=true;btn.textContent='…';
  const status=document.getElementById('statusBar');
  try{
    // fetch current board.json via API to get sha
    const gr=await fetch(GH_API,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    if(!gr.ok)throw new Error('fetch '+gr.status);
    const gd=await gr.json();
    const sha=gd.sha;
    const current=JSON.parse(atob(gd.content.replace(/\n/g,'')));
    current.messages=current.messages||[];
    current.messages.push(entry);
    const newContent=btoa(unescape(encodeURIComponent(JSON.stringify(current,null,2))));
    const pr=await fetch(GH_API,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'board: '+entry.session+' '+entry.type,content:newContent,sha})});
    if(!pr.ok){const pe=await pr.json().catch(()=>({}));throw new Error((pe.message||'PUT '+pr.status));}
    document.getElementById('msgInp').value='';
    document.getElementById('clipOut').classList.remove('show');
    status.textContent='✓ posted';
    setTimeout(()=>reload(),1200);
  }catch(e){
    status.textContent='post failed: '+e.message;
    if(e.message.includes('401')||e.message.includes('403')||e.message.includes('Bad credentials')){lsSet('_gh','');document.getElementById('postHint').style.display='';}
  }finally{
    btn.disabled=false;btn.textContent='Post';
  }
}
function openSecret(){document.getElementById('secretInp').value=lsGet('_bk');document.getElementById('overlayKey').classList.add('show');setTimeout(()=>document.getElementById('secretInp').focus(),50);}
function closeSecret(){document.getElementById('overlayKey').classList.remove('show');}
function saveSecret(){lsSet('_bk',document.getElementById('secretInp').value);closeSecret();reload();}
function openToken(){document.getElementById('tokenInp').value=lsGet('_gh');document.getElementById('overlayToken').classList.add('show');setTimeout(()=>document.getElementById('tokenInp').focus(),50);}
function closeToken(){document.getElementById('overlayToken').classList.remove('show');}
function saveToken(){lsSet('_gh',document.getElementById('tokenInp').value);closeToken();document.getElementById('postHint').style.display='none';}
document.getElementById('msgInp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});
document.getElementById('msgInp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();postMsg();}});
document.getElementById('overlayKey').addEventListener('click',e=>{if(e.target===document.getElementById('overlayKey'))closeSecret();});
document.getElementById('overlayToken').addEventListener('click',e=>{if(e.target===document.getElementById('overlayToken'))closeToken();});
document.getElementById('secretInp').addEventListener('keydown',e=>{if(e.key==='Enter')saveSecret();});
document.getElementById('tokenInp').addEventListener('keydown',e=>{if(e.key==='Enter')saveToken();});
if(!lsGet('_gh'))document.getElementById('postHint').style.display='';
loadBoard();
setInterval(loadBoard,REFRESH_MS);
</script>
</body>
</html>
