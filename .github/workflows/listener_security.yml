name: Security Listener (Network/IT/ITSupport)

on:
  push:
    paths:
      - board.json

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security listener
        env:
          BOARD_SECRET: ${{ secrets.BOARD_SECRET }}
        run: python3 listener_security.py board.json

      - name: Commit alerts if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board.json
          git diff --staged --quiet || git commit -m "security: listener alerts [skip ci]"
          git push
